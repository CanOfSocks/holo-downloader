services:
  holo-downloader:
    image: ghcr.io/canofsocks/holo-downloader:main
    container_name: holo-downloader
    restart: unless-stopped
    environment:
      - TZ=Etc/UTC
      # - S3_ENABLED=true
      # - S3_BUCKET=my-archive-bucket
      # - S3_PREFIX=hololive
      # - AWS_REGION=us-east-1
      # - AWS_ACCESS_KEY_ID
      # - AWS_SECRET_ACCESS_KEY
      # - AWS_ENDPOINT_URL=https://<accountid>.r2.cloudflarestorage.com
    volumes:
      - $PWD/config.toml:/app/config.toml
      - $PWD/cookies.txt:/app/cookies.txt
      - $PWD/tmp:/app/temp
      - $PWD/downloads/done:/app/Done
      - $PWD/downloads/members:/app/Members
      - $PWD/downloads/CommunityPosts:/app/CommunityPosts
    ports: # this port mapping is for the included webui. optional if you don't intend to use the webui
      - 5000:5000
    logging:
      driver: json-file
      options:
        max-size: "10m"
