{% from "_macros.html" import local_time, status_color %}
<div class="table-responsive">
<table class="table table-sm align-middle mb-0 small">
    <thead>
        <tr>
            <th class="d-none d-md-table-cell">ID</th>
            <th>Video ID</th>
            <th class="d-none d-sm-table-cell">Type</th>
            <th>Status</th>
            <th class="d-none d-sm-table-cell">Size</th>
            <th>Date</th>
        </tr>
    </thead>
    <tbody>
        {% for row in history %}
        <tr class="{{ 'table-secondary text-muted' if (row.status or '') | lower == 'cancelled' }}">
            <td class="d-none d-md-table-cell">{{ row.id }}</td>
            <td>
                <a href="https://www.youtube.com/watch?v={{ row.video_id }}" target="_blank" rel="noopener noreferrer">{{ row.video_id }}</a>
            </td>
            <td class="d-none d-sm-table-cell">{{ row.type }}</td>
            <td><span class="badge {{ status_color(row.status) }}">{{ row.status }}</span></td>
            <td class="text-nowrap d-none d-sm-table-cell">{{ row.total_size | convert_bytes }}</td>
            <td class="text-nowrap">{{ local_time(row.timestamp | utc_iso) }}</td>
        </tr>
        {% else %}
        <tr><td colspan="6" class="text-center text-muted">No history yet.</td></tr>
        {% endfor %}
    </tbody>
</table>
</div>
